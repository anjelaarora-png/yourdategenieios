<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Date Genie — Scroll Hero Preview</title>
<style>
  :root{ --maroon:#3c1117; --gold:#e0bc5a; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--maroon); color:var(--gold); font-family:Georgia,'Times New Roman',serif; }

  /* ===== SCROLL HERO ===== */
  .ydg-hero{ position:relative; height:340vh; background:var(--maroon); } /* taller = slower scrub */
  .ydg-sticky{ position:sticky; top:0; height:100vh; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  #ydgVideo{ width:100%; height:100%; object-fit:cover; display:block; background:var(--maroon); }
  .ydg-scrim{ position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 80% at 50% 28%, transparent 58%, rgba(60,17,23,.55)); }
  .ydg-hint{ position:absolute; bottom:5vh; left:0; right:0; text-align:center; font-size:14px;
    letter-spacing:.12em; text-transform:uppercase; opacity:.8; animation:bob 2s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); opacity:.55 } 50%{ transform:translateY(6px); opacity:.9 } }

  /* demo content below the hero so you can scroll past it */
  .after{ min-height:120vh; padding:14vh 8vw; text-align:center; }
  .after h1{ font-size:clamp(28px,5vw,52px); margin-bottom:18px; }
  .after p{ font-size:18px; opacity:.85; max-width:560px; margin:0 auto 28px; line-height:1.6; }
  .cta{ display:inline-block; padding:14px 30px; border:1px solid var(--gold); border-radius:40px;
    color:var(--gold); text-decoration:none; letter-spacing:.08em; }

  @media (prefers-reduced-motion: reduce){ .ydg-hero{ height:100vh; } .ydg-hint{ display:none; } }
</style>
</head>
<body>

  <!-- ============ SCROLL-SCRUB HERO ============ -->
  <section class="ydg-hero">
    <div class="ydg-sticky">
      <video id="ydgVideo" src="ydg_master_hd.mp4" poster="ydg_poster.jpg" muted playsinline preload="auto"></video>
      <div class="ydg-scrim"></div>
      <div class="ydg-hint">scroll ↓</div>
    </div>
  </section>

  <!-- your real page content continues here -->
  <section class="after">
    <h1>The post-swipe era starts here.</h1>
    <p>Tell the Genie what you both love. Get the whole night planned — the place, the playlist, the gift, what to wear, even the conversation. You just show up.</p>
    <a class="cta" href="#">Join the waitlist</a>
  </section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);
  const v = document.getElementById('ydgVideo');
  v.pause();
  function wire(){
    if(!v.duration) return;
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ v.loop=true; v.play(); return; }
    ScrollTrigger.create({
      trigger: '.ydg-hero', start: 'top top', end: 'bottom bottom', scrub: 0.8,
      onUpdate: s => { v.currentTime = s.progress * (v.duration || 0); }
    });
  }
  v.addEventListener('loadedmetadata', wire);
  if(v.readyState >= 1) wire();
</script>
</body>
</html>
